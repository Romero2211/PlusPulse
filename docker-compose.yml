# Локальна PostgreSQL для розробки та інтеграційних тестів.
# Запуск: docker compose up -d
# Зупинка: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pluspulse
      POSTGRES_PASSWORD: pluspulse
      POSTGRES_DB: pluspulse
    volumes:
      - pluspulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluspulse -d pluspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pluspulse_pg_data:
